<form action="" method="post" class="form-card">

    <div class="form-group">
        <label>Parking Name</label>
        <input type="text" name="parkingName" required>
    </div>

    <div class="form-group">
        <label>Location</label>
        <input type="text" name="location" required>
    </div>

    <div class="form-group">
        <label>City</label>
        <input type="text" name="city" required>
    </div>

    <div class="form-group">
        <label>Full Address</label>
        <textarea name="address" required></textarea>
    </div>

    <div class="form-group">
        <label>Total Slots</label>
        <input type="number" name="totalSlots" min="1" required>
    </div>

    <div class="form-group">
        <label>Price Per Hour (₹)</label>
        <input type="number" name="pricePerHour" min="1" step="0.01" required>
    </div>

    <div class="form-group">
        <label>Description</label>
        <textarea name="description"></textarea>
    </div>

    <button type="submit" class="btn">Add Parking Area</button>

</form>
