
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | ParkEase</title>

    <link rel="stylesheet" href="css/profile.css">
</head>
<body>

<div class="dashboard-layout">

    <!-- Left Sidebar -->
    <aside class="sidebar">

        <h2 class="logo">ParkEase</h2>

        <nav>
            <a href="user-dashboard.html">Dashboard</a>
            <a href="findparking.html">Find Parking</a>
            <a href="parkingslots.html">Parking Slots</a>
            <a href="payment.html">Payments</a>
            <a href="feedback.html">Feedback</a>
            <a href="complaint.html">Complaints</a>
            <a href="profile.html" class="active">My Profile</a>
            <a href="login.html">Logout</a>
        </nav>

    </aside>

    <!-- Right Content -->
    <main class="main-content">

        <div class="container">

            <div class="heading">
                <h1>My Profile</h1>
                <p>Manage your personal information</p>
            </div>

            <section class="profile-card">

                <div class="profile-header">

                    <div class="avatar" id="avatar">P</div>

                    <div>
                        <h2 id="displayName">ParkEase User</h2>
                        <p>ParkEase User Account</p>
                    </div>

                </div>

                <form id="profileForm">

                    <h3>Personal Information</h3>

                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="name" required readonly>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="email" required readonly>
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="phone" maxlength="10"
                               pattern="[0-9]{10}" required readonly>
                    </div>

                    <div class="form-group">
                        <label>Account Role</label>
                        <input type="text" id="role" readonly>
                    </div>

                    <div id="message"></div>

                    <div class="buttons">
                        <button type="submit" id="saveBtn">
                            Save Changes
                        </button>

                        <button type="reset" id="resetBtn">
                            Reset
                        </button>
                    </div>

                </form>

            </section>

        </div>

    </main>

</div>

<script src="js/profile.js"></script>

</body>
</html>
